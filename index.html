
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turkiya milliy taomlari</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff5ed;
}
header {
  background: #c8102e;
  color: white;
  text-align: center;
  padding: 30px 10px;
}
header h1 { font-size: 28px; }
h2 {
  text-align: center;
  color: #c8102e;
  margin: 30px 0;
}
.foods {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 15px;
  max-width: 1000px;
  margin: auto;
}
.card {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 3px 12px #0002;
  text-align: center;
}
.card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}
.card h3 {
  color: #c8102e;
  padding: 10px 2px;
  font-size: 17px;
}
footer {
  background: #c8102e;
  color: white;
  text-align: center;
  padding: 20px;
  margin-top: 30px;
}
</style>
</head>
<body>

<header>
  <h1>🇹🇷 Turkiya milliy taomlari</h1>
  <p>Turk oshxonasining mazali dunyosi</p>
</header>

<h2>🍽️ Mashhur turk taomlari</h2>

<div class="foods">

<div class="card">
<img src="https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=500" alt="Doner">
<h3>🥙 Doner kabob</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=500" alt="Kabob">
<h3>🍖 Kabob</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=500" alt="Baklava">
<h3>🍯 Baklava</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500" alt="Pide">
<h3>🥧 Pide</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1547592180-85f173990554?w=500" alt="Lahmacun">
<h3>🍕 Lahmacun</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1525351484163-7529414344d8?w=500" alt="Menemen">
<h3>🍳 Menemen</h3>
</div>

</div>

<footer>
<p>🇹🇷 Turkiya milliy taomlari ❤️</p>
</footer>

</body>
</html>
